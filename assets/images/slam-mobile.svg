<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Mobile SLAM visualisation</title>
  <desc id="desc">Nord-coloured abstract camera frame, map features and localisation path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e3440"/>
      <stop offset="1" stop-color="#1f242d"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="20%" r="70%">
      <stop offset="0" stop-color="#88c0d0" stop-opacity=".3"/>
      <stop offset="1" stop-color="#88c0d0" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>
  <g opacity=".15" stroke="#d8dee9">
    <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200M0 600H1200M0 700H1200M0 800H1200"/>
    <path d="M100 0V900M200 0V900M300 0V900M400 0V900M500 0V900M600 0V900M700 0V900M800 0V900M900 0V900M1000 0V900M1100 0V900"/>
  </g>
  <g fill="none" stroke="#8fbcbb" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M104 690C204 610 256 730 348 614S510 544 572 440 712 292 808 334 920 310 1086 160"/>
  </g>
  <g fill="#a3be8c">
    <circle cx="104" cy="690" r="14"/><circle cx="348" cy="614" r="14"/><circle cx="572" cy="440" r="14"/><circle cx="808" cy="334" r="14"/><circle cx="1086" cy="160" r="14"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="330" y="205" width="540" height="350" rx="40" fill="#3b4252" stroke="#88c0d0" stroke-width="4"/>
    <rect x="370" y="245" width="460" height="270" rx="24" fill="#242933" stroke="#4c566a" stroke-width="3"/>
    <path d="M420 468l96-110 81 64 100-126 86 112" fill="none" stroke="#81a1c1" stroke-width="10" stroke-linejoin="round"/>
    <circle cx="704" cy="322" r="28" fill="#ebcb8b"/>
  </g>
  <g fill="#b48ead">
    <circle cx="248" cy="244" r="8"/><circle cx="922" cy="488" r="8"/><circle cx="960" cy="236" r="8"/><circle cx="194" cy="498" r="8"/><circle cx="742" cy="672" r="8"/>
  </g>
  <g fill="#eceff4" font-family="sans-serif">
    <text x="72" y="78" font-size="28" font-weight="700" letter-spacing="6">REAL-TIME MOBILE SLAM</text>
    <text x="72" y="118" font-size="18" fill="#aeb8c8">feature map · camera trajectory · visual odometry</text>
  </g>
</svg>
